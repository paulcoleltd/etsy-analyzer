[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.45.0",
    "httpx==0.27.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "elasticsearch[async]==8.14.0",
    "redis==5.0.7",
    "bullmq==0.3.4",
    "scikit-learn==1.5.1",
    "xgboost==2.1.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "joblib==1.4.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "tenacity==8.5.0",
    "fake-useragent==1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
