[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.3",
    "httpx==0.27.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "elasticsearch[async]==8.14.0",
    "redis[hiredis]==5.0.7",
    "asyncpg==0.29.0",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "xgboost==2.1.0",
    "joblib==1.4.2",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
